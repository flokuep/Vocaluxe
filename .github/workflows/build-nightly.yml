name: Nightly build

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build-windows:
    name: Build Windows
    uses: ./.github/workflows/dotnet-desktop.yml

  collect-release-data:
    runs-on: ubuntu-latest
    needs: build-windows
    name: Collect release data
    steps:
    - run: ${{ tojson(needs) }}
      shell: cat {0}

  publish:
    runs-on: windows-latest
    needs: collect-release-data
    name: Publish release
    steps:
    - name: Create Release
      if: ${{ github.event_name == 'push'}}
      uses: ncipollo/release-action@v1.14.0
      with:
          name: Latest Nightly build
          tag: Nightly
          prerelease: true
          allowUpdates: true
          artifacts: Vocaluxe_Nightly_x64

  attach-artifacts:
    needs: [build-windows, publish]
    strategy:
      matrix:
        build:
          - label: "Windows_x86"
            url: ${{needs.build-windows.outputs.x86}}
          - label: "Windows_x64"
            url: ${{needs.build-windows.outputs.x64}}

    runs-on: windows-latest
    steps:
    - name: Download artifact
      run: |
          Invoke-WebRequest -Uri ${{ matrix.url }}  -OutFile 'Vocaluxe_Nightly_${{ matrix.label}}.zip'

    - name: Attach to release
      uses: softprops/action-gh-release@v2
      with:
        files: Vocaluxe_Nightly_${{ matrix.label}}.zip
        tag: Nightly


