name: Nightly build

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build-windows:
    uses: ./.github/workflows/dotnet-desktop

  publish:
    runs-on: windows-latest
    needs: build-windows
    steps:
    - name: Create Release
      if: ${{ github.event_name == 'push'}}
      uses: ncipollo/release-action@v1.14.0
      with:
          name: Latest Nightly build
          tag: Nightly
          prerelease: true
          allowUpdates: true
          artifacts: Vocaluxe_Nightly_x64
