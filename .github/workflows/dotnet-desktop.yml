name: Build and test application

on: 
    workflow_call:
        inputs:
          version:
            required: true
            type: string
          version-name:
            required: true
            type: string
        outputs:
            x64: 
                value: ${{ jobs.build.outputs.x64}}
            x86:
                value: ${{ jobs.build.outputs.x86}}

jobs:
    build:
         strategy:
             matrix:
                configuration: [ReleaseWin]
                platform: [x86,x64]
         name: ${{ matrix.platform }}
         runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on
         env:
            Solution_Name: Vocaluxe.sln
            VersionTag: ${{ inputs.version }}
            Version_Name: ${{ inputs.version-name }}
            Artifact_Name: Vocaluxe_Nightly_${{ matrix.platform }}
      
         outputs:
            x86: ${{ steps.create-output.outputs.x86 }}
            x64: ${{ steps.create-output.outputs.x64 }}

         steps:
         - name: Checkout
           uses: actions/checkout@v4
    # Install the .NET Core workload
         - name: Install .NET Core
           uses: actions/setup-dotnet@v4

         - name: Setup Nuget
           uses: Nuget/setup-nuget@v2

         - name: Restore nuget packages
           run: nuget restore -DisableParallelProcessing $env:Solution_Name

    # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
         - name: Setup MSBuild.exe
           uses: microsoft/setup-msbuild@v2

    # Restore the application to populate the obj folder with RuntimeIdentifiers
         - name: Restore the application
           run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration
           env:
             Configuration: ${{ matrix.configuration }}

    # Create the app package by building and packaging the Windows Application Packaging project
         - name: Create the app package
           run: msbuild $env:Solution_Name /p:Configuration=$env:Configuration
           env:
            Configuration: ${{ matrix.configuration }}

         - name: Download and add video files
           run: |          
             Invoke-WebRequest -Uri 'https://github.com/Vocaluxe/VocaluxeDependencies/blob/master/zips/themes/vocaluxe.themes.vocaluxe-2024.video-part1.zip?raw=true' -OutFile 'vocaluxe.themes.vocaluxe-2024.video-part1.zip'
             Invoke-WebRequest -Uri 'https://github.com/Vocaluxe/VocaluxeDependencies/blob/master/zips/themes/vocaluxe.themes.vocaluxe-2024.video-part2.zip?raw=true' -OutFile 'vocaluxe.themes.vocaluxe-2024.video-part2.zip'
             7z x '-aoa' '-oOutput/' './vocaluxe.themes.vocaluxe-2024.video-part1.zip'
             Remove-Item './vocaluxe.themes.vocaluxe-2024.video-part1.zip'
             Remove-Item './vocaluxe.themes.vocaluxe-2024.video-part2.zip'

    # Upload the MSIX package: https://github.com/marketplace/actions/upload-a-build-artifact
         - name: Upload build artifact
           id: upload-artifact
           uses: actions/upload-artifact@v4
           with:
             name: ${{ env.Artifact_Name }}
             path: Output

         - name: Create output
           id: create-output
           run: echo "${{ matrix.platform }}=${{ env.Artifact_Name }}" >> $ENV:GITHUB_OUTPUT