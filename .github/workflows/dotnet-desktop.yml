name: Nightly build

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:

  build:
    - uses: ./.github/actions/dotnet-desktop

    - name: Create Release
      if: ${{ github.event_name == 'push'}}
      uses: ncipollo/release-action@v1.14.0
      with:
          name: Latest Nightly build
          tag: Nightly
          prerelease: true
          allowUpdates: true
          artifacts: Vocaluxe_Nightly_${{ matrix.platform }}
