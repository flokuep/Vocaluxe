name: Nightly build

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: ./.github/actions/dotnet-desktop

  publish:
    runs-on: windows-latest
    steps:
    - name: Create Release
      if: ${{ github.event_name == 'push'}}
      needs: build-windows
      uses: ncipollo/release-action@v1.14.0
      with:
          name: Latest Nightly build
          tag: Nightly
          prerelease: true
          allowUpdates: true
          artifacts: Vocaluxe_Nightly_${{ matrix.platform }}
